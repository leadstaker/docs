name: Sync OpenAPI from production

on:
  repository_dispatch:
    types: [api-deployed]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-openapi

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch spec
        run: |
          curl -fsS https://n-api.leadstaker.com/openapi.json -o "$RUNNER_TEMP/openapi.json"
          jq . "$RUNNER_TEMP/openapi.json" > api-reference/openapi.json

      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync openapi from production"
          git push
